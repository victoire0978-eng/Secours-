kind = "web"
previewPath = "/"
title = "NLSbox"
description = "A full-stack anime and manga discovery app for searching, streaming, downloading, and managing episodes from configured channels."
version = "1.0.0"
id = "artifacts/nlsbox"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21930

[services.development]
run = "pnpm --filter @workspace/nlsbox run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/nlsbox", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
PORT = "21930"
BASE_PATH = "/"

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/nlsbox/dist/server.cjs" ]

[services.production.run.env]
PORT = "21930"
NODE_ENV = "production"
NLSBOX_APP_ROOT = "artifacts/nlsbox"

[services.production.health.startup]
path = "/api/health"

[services.env]
PORT = "21930"
BASE_PATH = "/"
