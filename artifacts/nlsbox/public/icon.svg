<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141E" />
      <stop offset="100%" stop-color="#09090D" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ambient Ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#glowGrad)" stroke-width="8" opacity="0.85" filter="url(#glow)" />

  <!-- Inner Soft Card -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="#181826" stroke="#2D2D44" stroke-width="3" />

  <!-- TV Icon Outline -->
  <rect x="120" y="150" width="272" height="190" rx="36" fill="#0F0F17" stroke="url(#glowGrad)" stroke-width="12" />
  
  <!-- Screen Inner -->
  <rect x="136" y="166" width="240" height="158" rx="24" fill="#0B0B12" />

  <!-- Play Symbol inside Screen -->
  <polygon points="230,205 310,245 230,285" fill="url(#glowGrad)" />

  <!-- TV Antenna or Stand Base -->
  <path d="M 216 116 L 256 150 L 296 116" fill="none" stroke="#A855F7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="216" cy="116" r="8" fill="#EF4444" />
  <circle cx="296" cy="116" r="8" fill="#6366F1" />

  <rect x="200" y="356" width="112" height="16" rx="8" fill="#4B5563" />
  <rect x="176" y="376" width="160" height="14" rx="7" fill="url(#glowGrad)" opacity="0.9" />
</svg>
